<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Engineered Serendipity · 阶段 1</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #2c2a26; --muted: #8a8578;
    --leaf: #5b8c5a; --leaf-dark: #3f6b3e; --line: #e3ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .reset { margin-left: auto; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  header .reset:hover { color: var(--ink); }
  main { flex: 1; display: flex; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .chat { flex: 1.4; border-right: 1px solid var(--line); }
  .tree { flex: 1; background: var(--panel); }
  .col h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0; padding: 14px 20px 8px; letter-spacing: .04em; }
  .scroll { flex: 1; overflow-y: auto; padding: 8px 20px 20px; }
  .msg { margin: 12px 0; max-width: 78%; line-height: 1.55; font-size: 14.5px; }
  .msg.claw { color: var(--ink); }
  .msg.claw .who { color: var(--leaf-dark); font-weight: 600; font-size: 12px; display: block; margin-bottom: 3px; }
  .msg.user { margin-left: auto; background: var(--leaf); color: #fff; padding: 9px 13px; border-radius: 14px 14px 4px 14px; }
  .msg.sys { color: var(--muted); font-size: 13px; font-style: italic; max-width: 100%; }
  .composer { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; background: var(--panel); }
  .composer textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font: inherit; font-size: 14.5px; height: 46px; background: #fff; color: var(--ink);
  }
  .composer textarea:focus { outline: none; border-color: var(--leaf); }
  button.primary { border: none; border-radius: 10px; background: var(--leaf); color: #fff; font: inherit; font-weight: 600; padding: 0 16px; cursor: pointer; }
  button.primary:hover { background: var(--leaf-dark); }
  button:disabled { opacity: .5; cursor: default; }
  .sprout-bar { padding: 10px 20px; border-bottom: 1px solid var(--line); }
  .sprout-bar button { width: 100%; }
  .branch {
    background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--leaf);
    border-radius: 8px; padding: 12px 14px; margin: 10px 0; animation: grow .5s ease;
  }
  @keyframes grow { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  .branch .title { font-weight: 600; font-size: 15px; }
  .branch .desc { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .branch .idx { font-size: 11px; color: var(--leaf); font-weight: 600; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; line-height: 1.6; }
  .grad { background: #eef6ed; border: 1px solid var(--leaf); color: var(--leaf-dark); border-radius: 8px; padding: 12px 14px; margin: 10px 0; font-size: 13.5px; line-height: 1.6; }
  .err { color: #b23; font-size: 13px; padding: 4px 20px; }
</style>
</head>
<body>
<header>
  <h1>🌳 你的 Claw</h1>
  <span class="sub">阶段 1 · 养你的 profile 树(聊到一段,点「生成枝桠」)</span>
  <button class="reset" id="reset">重新开始</button>
</header>
<main>
  <section class="col chat">
    <h2>对话</h2>
    <div class="scroll" id="chatScroll"></div>
    <div class="err" id="err"></div>
    <div class="composer">
      <textarea id="input" placeholder="跟它说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="primary" id="send">发送</button>
    </div>
  </section>
  <section class="col tree">
    <h2>我的 PROFILE 树</h2>
    <div class="sprout-bar">
      <button class="primary" id="sprout">🌱 把刚才聊的长成一根枝桠</button>
    </div>
    <div class="scroll" id="branchScroll"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const chatScroll = $("chatScroll"), branchScroll = $("branchScroll"), errBox = $("err");
let target = 3;

function showErr(m) { errBox.textContent = m || ""; }

function addMsg(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "claw") {
    div.innerHTML = `<span class="who">Claw</span>`;
    div.append(document.createTextNode(content));
  } else {
    div.textContent = content;
  }
  chatScroll.appendChild(div);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function renderBranches(branches, graduated) {
  branchScroll.innerHTML = "";
  if (!branches.length) {
    branchScroll.innerHTML = `<div class="empty">还没有枝桠。<br>跟 Claw 聊一段你在意的事，然后点上面的按钮 —— 看它把你的话转写成什么。</div>`;
    return;
  }
  branches.forEach((b, i) => {
    const div = document.createElement("div");
    div.className = "branch";
    div.innerHTML = `<div class="idx">枝桠 ${i + 1} / ${target}</div>
      <div class="title"></div><div class="desc"></div>`;
    div.querySelector(".title").textContent = b.title;
    div.querySelector(".desc").textContent = b.description;
    branchScroll.appendChild(div);
  });
  if (graduated) {
    const g = document.createElement("div");
    g.className = "grad";
    g.textContent = "🌟 你的树已经长出 3 根枝桠 —— Claw 对你有了基本的了解。（这就是闸门 A：看着这些枝桠，你想不想继续说下去？）";
    branchScroll.appendChild(g);
  }
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.detail || ("请求失败 " + res.status));
  }
  return res.json();
}

function busy(on) { $("send").disabled = on; $("sprout").disabled = on; }

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  showErr(""); busy(true);
  addMsg("user", text); $("input").value = "";
  try {
    const r = await api("/api/chat", { message: text });
    addMsg("claw", r.claw_message);
  } catch (e) { showErr(e.message); }
  busy(false); $("input").focus();
}

async function sprout() {
  showErr(""); busy(true);
  try {
    const r = await api("/api/sprout");
    target = r.graduation_target;
    const s = await api("/api/state");
    renderBranches(s.branches, r.graduated);
  } catch (e) { showErr(e.message); }
  busy(false);
}

async function reset() {
  if (!confirm("清空对话和所有枝桠，重新开始？")) return;
  await api("/api/reset");
  location.reload();
}

$("send").onclick = send;
$("sprout").onclick = sprout;
$("reset").onclick = reset;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

(async function init() {
  try {
    const s = await api("/api/state");
    target = s.graduation_target;
    s.turns.forEach((t) => addMsg(t.role, t.content));
    renderBranches(s.branches, s.graduated);
    if (!s.turns.length) {
      // 第一次进来：让 Claw 先开口
      busy(true);
      const r = await api("/api/chat", { message: "" });
      addMsg("claw", r.claw_message);
      busy(false);
    }
  } catch (e) { showErr(e.message); }
})();
</script>
</body>
</html>
